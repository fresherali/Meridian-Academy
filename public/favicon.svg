<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <!-- Pure White Background -->
  <rect width="600" height="600" fill="#FFFFFF" />

  <g transform="translate(50, 20)">
    <!-- Graduation Cap (Gold Accent) -->
    <path d="M 175,120 L 255,90 L 335,120 L 255,150 Z" fill="#C59B27" />
    <path d="M 205,135 L 205,165 C 205,180 305,180 305,165 L 305,135" fill="none" stroke="#A67C1E" stroke-width="6" />
    <path d="M 325,125 L 340,165 C 340,175 345,175 345,165 L 345,125" fill="none" stroke="#C59B27" stroke-width="4" />

    <!-- Main 'M' Shape (Deep Navy #153163) -->
    <path d="M 150,350 L 150,170 L 200,170 L 250,260 L 300,170 L 350,170 L 350,350 L 305,350 L 305,230 L 255,320 L 245,320 L 195,230 L 195,350 Z" fill="#153163" />

    <!-- Upward Growth Arrow (Gold/Navy blend matching your selection) -->
    <path d="M 210,310 C 240,290 280,230 350,120 L 360,130 L 365,105 L 340,110 L 350,120 C 285,225 245,280 210,310 Z" fill="#C59B27" />

    <!-- MERIDIAN Text (Gold #C59B27) -->
    <text x="250" y="420" font-family="&#39;Poppins&#39;, &#39;Arial Black&#39;, sans-serif" font-size="52" font-weight="900" fill="#C59B27" text-anchor="middle" letter-spacing="4">
      MERIDIAN
    </text>

    <!-- ACADEMY Text (Deep Navy #153163) -->
    <text x="250" y="475" font-family="&#39;Poppins&#39;, &#39;Arial Black&#39;, sans-serif" font-size="38" font-weight="900" fill="#153163" text-anchor="middle" letter-spacing="8">
      ACADEMY
    </text>
  </g>
</svg>